<!DOCTYPE html>
<html lang="en" data-theme="light">
 
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NewzTable — Your Personalised News Feed</title>
  <meta name="description"
    content="Stay informed with news personalised to your interests. No signup required." />
 
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet" />
 
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet" />
 
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
 
  <!-- Custom CSS -->
  <link href="css/app.css" rel="stylesheet" />
</head>
 
<body>
 
  <!-- App Shell -->
  <div id="app" class="d-none">
 
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="logo-text">Newz<span class="logo-accent">Table</span></span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="feed">
          <i class="bi bi-house-fill"></i>
          <span>Home</span>
        </a>
        <a href="#" class="nav-item" data-page="search">
          <i class="bi bi-search"></i>
          <span>Search</span>
        </a>
        <a href="#" class="nav-item" data-page="bookmarks">
          <i class="bi bi-bookmark-fill"></i>
          <span>Saved</span>
        </a>
        <a href="#" class="nav-item" data-page="settings">
          <i class="bi bi-gear-fill"></i>
          <span>Settings</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="theme-toggle" id="themeToggle">
          <i class="bi bi-moon-fill"></i>
          <span>Dark Mode</span>
          <div class="toggle-switch">
            <input type="checkbox" id="darkModeCheck" aria-label="Enable dark mode" title="Enable dark mode" />
            <label for="darkModeCheck"><span class="visually-hidden">Enable dark mode</span></label>
          </div>
        </div>
      </div>
    </aside>
 
    <!-- Main Content -->
    <main id="main" class="main-content">
 
      <!-- Top Bar (mobile) -->
      <header class="topbar d-lg-none">
        <button class="btn-menu" id="menuToggle" title="Open navigation menu" aria-label="Open navigation menu">
          <i class="bi bi-list"></i>
        </button>
        <span class="logo-text">Newz<span class="logo-accent">Table</span></span>
        <button class="btn-icon" id="searchToggle" title="Search" aria-label="Search">
          <i class="bi bi-search"></i>
        </button>
      </header>
 
      <!-- Pages -->
      <div id="page-feed" class="page active"></div>
      <div id="page-search" class="page"></div>
      <div id="page-bookmarks" class="page"></div>
      <div id="page-settings" class="page"></div>
 
    </main>
 
    <!-- Mobile Bottom Nav -->
    <nav class="bottom-nav d-lg-none">
      <a href="#" class="bottom-nav-item active" data-page="feed">
        <i class="bi bi-house-fill"></i>
        <span>Home</span>
      </a>
      <a href="#" class="bottom-nav-item" data-page="search">
        <i class="bi bi-search"></i>
        <span>Search</span>
      </a>
      <a href="#" class="bottom-nav-item" data-page="bookmarks">
        <i class="bi bi-bookmark-fill"></i>
        <span>Saved</span>
      </a>
      <a href="#" class="bottom-nav-item" data-page="settings">
        <i class="bi bi-gear-fill"></i>
        <span>Settings</span>
      </a>
    </nav>
 
    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
 
  </div>
 
  <!-- Onboarding -->
  <div id="onboarding" class="d-none"></div>
 
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
  <!-- App Scripts -->
  <script type="module" src="js/app.js"></script>
 
</body>
</html>
